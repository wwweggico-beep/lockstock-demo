<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOCKSTOCK - Smart Warehouse Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* 3D 柜门 */
    .perspective-box { perspective: 300px; }
    .locker-door {
      transform-origin: left center;
      transition: transform 0.4s ease, background-color 0.3s;
    }
    .door-open {
      transform: rotateY(-80deg);
      background-color: #34d399 !important;
    }

    /* 手机呼吸灯 */
    @keyframes orangeGlow {
      0%, 100% { box-shadow: 0 0 10px rgba(245, 158, 11, 0.2); }
      50% { box-shadow: 0 0 25px rgba(245, 158, 11, 0.7); }
    }
    .alert-glow-orange {
      animation: orangeGlow 1.2s infinite ease-in-out;
      border-color: #f59e0b !important;
    }

    @keyframes redGlow {
      0%, 100% { box-shadow: 0 0 10px rgba(239, 68, 68, 0.3); }
      50% { box-shadow: 0 0 30px rgba(239, 68, 68, 0.9); }
    }
    .alert-glow-red {
      animation: redGlow 1.2s infinite ease-in-out;
      border-color: #ef4444 !important;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .log-enter { animation: slideIn 0.35s ease-out forwards; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 flex h-screen w-screen overflow-hidden font-sans m-0 p-0">

  <!-- ================= LEFT: 宽敞大字版库房全景 ================= -->
  <div id="warehouse-view" class="w-[65%] h-full border-r border-slate-300 relative flex flex-col justify-between p-6 bg-slate-200 select-none overflow-hidden">
    
    <!-- 标头与创始人名字 -->
    <div class="z-20">
      <h1 class="text-base font-black tracking-wider text-slate-900 uppercase">Lockstock Demo</h1>
      <p class="text-xs text-slate-600 font-medium">Founders: Marie Avdonina &amp; Zhe Hao</p>
    </div>

    <!-- 5 排加宽加大智能柜矩阵 (更大字号、超大走廊) -->
    <div class="absolute top-14 left-1/2 -translate-x-1/2 flex flex-col space-y-7 z-10 w-[440px]">
      
      <!-- ROW 01 -->
      <div class="flex items-center space-x-2 bg-slate-300/80 p-1.5 rounded-lg border border-slate-400">
        <div class="w-20 text-center leading-tight"><div class="text-[9px] text-slate-500 font-black">LOCKSTOCK</div><div class="text-[10px] font-mono font-black text-slate-700">ROW 01</div></div>
        <div class="w-14 h-8 bg-white border border-slate-300 rounded text-[10px] font-mono font-bold flex items-center justify-center">SKU-01</div>
        <div class="w-14 h-8 bg-white border border-slate-300 rounded text-[10px] font-mono font-bold flex items-center justify-center">SKU-02</div>
        <div class="w-14 h-8 bg-white border border-slate-300 rounded text-[10px] font-mono font-bold flex items-center justify-center">SKU-03</div>
        <div class="w-14 h-8 bg-white border border-slate-300 rounded text-[10px] font-mono font-bold flex items-center justify-center">SKU-04</div>
      </div>

      <!-- ROW 02 -->
      <div class="flex items-center space-x-2 bg-slate-300/80 p-1.5 rounded-lg border border-slate-400">
        <div class="w-20 text-center leading-tight"><div class="text-[9px] text-slate-500 font-black">LOCKSTOCK</div><div class="text-[10px] font-mono font-black text-slate-700">ROW 02</div></div>
        <div class="w-14 h-8 bg-white border border-slate-300 rounded text-[10px] font-mono font-bold flex items-center justify-center">SKU-05</div>
        <div class="w-14 h-8 bg-white border border-slate-300 rounded text-[10px] font-mono font-bold flex items-center justify-center">SKU-06</div>
        <div class="w-14 h-8 bg-white border border-slate-300 rounded text-[10px] font-mono font-bold flex items-center justify-center">SKU-07</div>
        <div class="w-14 h-8 bg-white border border-slate-300 rounded text-[10px] font-mono font-bold flex items-center justify-center">SKU-08</div>
      </div>

      <!-- ROW 03: 核心互动格口 (正下方留出超宽走廊) -->
      <div id="row-target" class="flex items-center space-x-2 bg-indigo-50/90 p-1.5 rounded-lg border-2 border-indigo-600 shadow">
        <div class="w-20 text-center leading-tight"><div class="text-[9px] text-indigo-600 font-black">LOCKSTOCK</div><div class="text-[10px] font-mono font-black text-indigo-800">ROW 03</div></div>
        <div class="w-14 h-8 bg-white border border-slate-300 rounded text-[10px] font-mono font-bold flex items-center justify-center">SKU-09</div>
        <div class="w-14 h-8 bg-white border border-slate-300 rounded text-[10px] font-mono font-bold flex items-center justify-center">SKU-10</div>
        
        <!-- 活动开门格口 -->
        <div class="perspective-box w-14 h-8">
          <div id="target-bin" class="locker-door w-full h-full bg-indigo-600 text-white rounded text-[10px] font-mono font-black flex items-center justify-center shadow">
            SKU-11
          </div>
        </div>

        <div class="w-14 h-8 bg-white border border-slate-300 rounded text-[10px] font-mono font-bold flex items-center justify-center">SKU-12</div>
      </div>

      <!-- ROW 04 -->
      <div class="flex items-center space-x-2 bg-slate-300/80 p-1.5 rounded-lg border border-slate-400">
        <div class="w-20 text-center leading-tight"><div class="text-[9px] text-slate-500 font-black">LOCKSTOCK</div><div class="text-[10px] font-mono font-black text-slate-700">ROW 04</div></div>
        <div class="w-14 h-8 bg-white border border-slate-300 rounded text-[10px] font-mono font-bold flex items-center justify-center">SKU-13</div>
        <div class="w-14 h-8 bg-white border border-slate-300 rounded text-[10px] font-mono font-bold flex items-center justify-center">SKU-14</div>
        <div class="w-14 h-8 bg-white border border-slate-300 rounded text-[10px] font-mono font-bold flex items-center justify-center">SKU-15</div>
        <div class="w-14 h-8 bg-white border border-slate-300 rounded text-[10px] font-mono font-bold flex items-center justify-center">SKU-16</div>
      </div>

      <!-- ROW 05 -->
      <div class="flex items-center space-x-2 bg-slate-300/80 p-1.5 rounded-lg border border-slate-400">
        <div class="w-20 text-center leading-tight"><div class="text-[9px] text-slate-500 font-black">LOCKSTOCK</div><div class="text-[10px] font-mono font-black text-slate-700">ROW 05</div></div>
        <div class="w-14 h-8 bg-white border border-slate-300 rounded text-[10px] font-mono font-bold flex items-center justify-center">SKU-17</div>
        <div class="w-14 h-8 bg-white border border-slate-300 rounded text-[10px] font-mono font-bold flex items-center justify-center">SKU-18</div>
        <div class="w-14 h-8 bg-white border border-slate-300 rounded text-[10px] font-mono font-bold flex items-center justify-center">SKU-19</div>
        <div class="w-14 h-8 bg-white border border-slate-300 rounded text-[10px] font-mono font-bold flex items-center justify-center">SKU-20</div>
      </div>
    </div>

    <!-- 舞台动画层 (纯原生双人前后流水线) -->
    <div class="w-full h-full absolute inset-0 pointer-events-none z-10">
      
      <!-- 排队队伍 (左下方) -->
      <div class="absolute bottom-6 left-10 flex flex-col space-y-2">
        <div class="w-3.5 h-6 relative"><div class="w-2.5 h-2.5 bg-blue-300 mx-auto rounded-xs"></div><div class="w-3.5 h-3.5 bg-blue-600 rounded-xs"></div></div>
        <div class="w-3.5 h-6 relative"><div class="w-2.5 h-2.5 bg-blue-300 mx-auto rounded-xs"></div><div class="w-3.5 h-3.5 bg-blue-600 rounded-xs"></div></div>
        <div class="w-3.5 h-6 relative"><div class="w-2.5 h-2.5 bg-blue-300 mx-auto rounded-xs"></div><div class="w-3.5 h-3.5 bg-blue-600 rounded-xs"></div></div>
      </div>

      <!-- 动态小人 1 -->
      <div id="worker-1" class="w-4 h-6 absolute opacity-0 z-20" style="left: 40px; top: 85%;">
        <div class="w-2.5 h-2.5 bg-blue-300 mx-auto rounded-xs"></div>
        <div class="w-4 h-3.5 bg-blue-600 rounded-xs flex items-center justify-end">
          <div class="item-hand w-1.5 h-1.5 bg-amber-400 border border-black hidden mr-[-2px]"></div>
        </div>
      </div>

      <!-- 动态小人 2 (前后脚流水线) -->
      <div id="worker-2" class="w-4 h-6 absolute opacity-0 z-20" style="left: 40px; top: 85%;">
        <div class="w-2.5 h-2.5 bg-blue-300 mx-auto rounded-xs"></div>
        <div class="w-4 h-3.5 bg-blue-600 rounded-xs flex items-center justify-end">
          <div class="item-hand w-1.5 h-1.5 bg-amber-400 border border-black hidden mr-[-2px]"></div>
        </div>
      </div>

      <!-- 补货员 + 推车 -->
      <div id="restocker-sprite" class="absolute flex items-end space-x-1 opacity-0 z-20" style="left: -90px; top: 250px;">
        <div class="w-4 h-6">
          <div class="w-2.5 h-2.5 bg-amber-200 mx-auto rounded-xs"></div>
