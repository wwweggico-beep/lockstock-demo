<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOCKSTOCK-AI - Smart Inventory System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-100 text-slate-800 flex flex-col md:flex-row h-screen w-screen overflow-hidden font-sans m-0 p-0">

  <!-- ================= LEFT: Physical Onsite Area ================= -->
  <div class="w-full md:w-1/2 h-1/2 md:h-full border-b md:border-b-0 md:border-r border-gray-300 relative flex flex-col items-center justify-center p-6 bg-slate-200">
    <div class="absolute top-6 left-6 text-xs font-bold tracking-widest text-slate-500 uppercase">
      ONSITE FACILITY
    </div>

    <!-- Smart Locker -->
    <div id="smart-locker" class="w-48 h-80 bg-white border-2 border-slate-400 rounded-xl flex flex-col justify-between p-3 shadow-xl relative z-10">
      <div class="text-xs font-black tracking-widest text-indigo-600 text-center border-b border-gray-200 pb-2">
        LOCKSTOCK-AI
      </div>
      <div class="h-10 bg-slate-100 rounded border border-slate-300 flex items-center justify-center text-xs text-slate-600 font-mono font-medium">SKU-1</div>
      <div class="h-10 bg-slate-100 rounded border border-slate-300 flex items-center justify-center text-xs text-slate-600 font-mono font-medium">SKU-2</div>
      <!-- 动态变色的活动格口 -->
      <div id="active-bin" class="h-10 bg-indigo-50 border-2 border-indigo-500 rounded flex items-center justify-center text-xs font-bold text-indigo-700 font-mono">
        SKU-3
      </div>
      <div class="h-10 bg-slate-100 rounded border border-slate-300 flex items-center justify-center text-xs text-slate-600 font-mono font-medium">SKU-4</div>
    </div>

    <!-- 员工队列 (纯色块代替) -->
    <div id="queue-area" class="absolute bottom-16 right-8 flex space-x-6 items-end">
      <div class="flex flex-col items-center">
        <div class="text-[9px] text-slate-500 font-mono mb-1">Emp 3</div>
        <div class="w-10 h-20 bg-blue-600 rounded-t border-t-4 border-blue-400 shadow"></div>
      </div>
      <div class="flex flex-col items-center">
        <div class="text-[9px] text-slate-500 font-mono mb-1">Emp 2</div>
        <div class="w-10 h-20 bg-blue-600 rounded-t border-t-4 border-blue-400 shadow"></div>
      </div>
      <div class="flex flex-col items-center">
        <div class="text-[9px] text-slate-500 font-mono mb-1">Emp 1</div>
        <div class="w-10 h-20 bg-blue-600 rounded-t border-t-4 border-blue-400 shadow"></div>
      </div>
    </div>

    <!-- 补货员 + 推车 -->
    <div id="restocker-group" class="absolute bottom-16 -left-48 flex items-end">
      <div class="flex flex-col items-center">
        <div class="text-[9px] text-amber-700 font-mono font-bold mb-1">Restocker</div>
        <div class="w-10 h-20 bg-amber-500 rounded-t border-t-4 border-amber-300 shadow"></div>
      </div>
      <div class="w-14 h-11 bg-amber-600 border border-amber-700 ml-1 rounded flex items-center justify-center text-[10px] text-white font-bold font-mono shadow">
        CART
      </div>
    </div>
  </div>

  <!-- ================= RIGHT: Mobile App Interface ================= -->
  <div class="w-full md:w-1/2 h-1/2 md:h-full flex items-center justify-center p-4 bg-gray-100">
    
    <!-- 手机外框 -->
    <div class="w-80 h-[580px] bg-white border-4 border-slate-300 rounded-[36px] p-4 flex flex-col justify-between shadow-2xl relative">
      
      <!-- 手机听筒 -->
      <div class="w-20 h-3 bg-slate-200 rounded-full mx-auto mb-2 shrink-0"></div>

      <!-- App Header: LOGO 区域 -->
      <div class="flex items-center justify-between border-b border-gray-200 pb-2 mb-2 shrink-0">
        <div class="flex items-center space-x-1">
          <div class="w-2.5 h-2.5 rounded-full bg-indigo-600"></div>
          <span class="text-xs font-black tracking-wider text-slate-800 font-mono">LOCKSTOCK-APP</span>
        </div>
        <span class="text-[9px] font-mono bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded font-bold">ONLINE</span>
      </div>

      <!-- 监控面板 -->
      <div class="bg-gray-50 p-2.5 rounded-xl border border-gray-200 mb-2 shrink-0">
        <div class="text-[9px] uppercase font-mono tracking-wider text-slate-500 mb-1.5 font-bold">Inventory Status</div>
        
        <div class="grid grid-cols-2 gap-2 text-center">
          <div class="bg-white p-1.5 rounded border border-gray-200">
            <span class="text-[9px] text-slate-400 uppercase block font-medium">In Stock</span>
            <span id="stock-val" class="text-lg font-mono font-black text-slate-800">100</span>
          </div>
          <div class="bg-white p-1.5 rounded border border-gray-200">
            <span class="text-[9px] text-slate-400 uppercase block font-medium">Forecast / Mo</span>
            <span id="forecast-val" class="text-lg font-mono font-black text-indigo-600">1,200</span>
          </div>
        </div>

        <div class="mt-2 text-[9px] flex justify-between items-center text-slate-600 px-1 font-mono">
          <span>Auto-Restock ETA:</span>
          <span id="timer-val" class="text-amber-700 font-bold bg-amber-100 px-1.5 py-0.5 rounded border border-amber-300">00:45</span>
        </div>
      </div>

      <!-- 动态警告展示区 (固定高度，防止跳屏) -->
      <div id="alert-box" class="h-8 mb-2 flex items-center justify-center shrink-0">
        <!-- 警告信息由此处插入 -->
      </div>

      <!-- 实时存取记录 -->
      <div class="flex-1 flex flex-col min-h-0">
        <span class="text-[9px] uppercase tracking-wider font-mono text-slate-500 mb-1 font-bold shrink-0">Activity Live Log</span>
        <div id="log-list" class="flex-1 bg-gray-50 rounded-xl p-2 overflow-y-auto no-scrollbar space-y-1.5 border border-gray-200 text-[10px] font-mono">
          <div class="p-1.5 bg-white rounded border border-gray-200 flex justify-between items-center text-slate-400">
            <span>READY</span>
            <span>SYSTEM STANDBY</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- ================= 核心动画驱动脚本 ================= -->
  <script>
    const INITIAL_STOCK = 100;
    let currentStock = INITIAL_STOCK;
    let forecastDemand = 1200;

    const stockEl = document.getElementById('stock-val');
    const forecastEl = document.getElementById('forecast-val');
    const timerEl = document.getElementById('timer-val');
    const logList = document.getElementById('log-list');
    const alertBox = document.getElementById('alert-box');
    const activeBin = document.getElementById('active-bin');

    function getTimestamp() {
      const d = new Date();
      return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}:${d.getSeconds().toString().padStart(2,'0')}`;
    }

    // 记录生成
    function logActivity(user, sku, item, qty) {
      currentStock -= qty;
      forecastDemand += (qty * 4);
      stockEl.innerText = currentStock;
      forecastEl.innerText = forecastDemand.toLocaleString();

      const itemEl = document.createElement('div');
      itemEl.className = "p-1.5 bg-white rounded border-l-2 border-indigo-500 border border-gray-200 flex justify-between items-center text-slate-700 shadow-sm";
      itemEl.innerHTML = `
        <div>
          <span class="text-indigo-600 font-bold">[${user}]</span> 
          <span class="text-slate-400">${getTimestamp()}</span>
          <div class="text-[9px] text-slate-500 font-semibold">${sku} · ${item}</div>
        </div>
        <span class="text-red-500 font-black">-${qty}</span>
      `;
      logList.prepend(itemEl);
    }

    // 弹出警报
    function showAlert(msg, level = 'warn') {
      const styles = {
        warn: 'bg-amber-100 text-amber-800 border-amber-300',
        danger: 'bg-red-100 text-red-800 border-red-300',
        info: 'bg-blue-100 text-blue-800 border-blue-300'
      };
      alertBox.innerHTML = `
        <div class="w-full text-[9px] font-bold py-1 px-2 rounded border ${styles[level]} flex items-center justify-between">
          <span>⚠️ ${msg}</span>
        </div>
      `;
      setTimeout(() => { alertBox.innerHTML = ''; }, 3500);
    }

    // 主循环流水线
    function startPipeline() {
      const tl = gsap.timeline({ repeat: -1 });

      // 阶段 1: Emp 1 取件
      tl.to("#queue-area", { x: -80, duration: 1.5 })
        .call(() => {
          activeBin.style.backgroundColor = "#86efac"; // 柜门亮绿
          logActivity("Emp 1", "SKU-3", "Precision Tool", 5);
        })
        .to(activeBin, { backgroundColor: "#e0e7ff", duration: 0.3, delay: 0.4 })
        
      // 阶段 2: Emp 2 取大件，触发异常警报
      tl.to("#queue-area", { x: -160, duration: 1.5, delay: 1 })
        .call(() => {
          activeBin.style.backgroundColor = "#86efac";
          logActivity("Emp 2", "SKU-3", "Precision Tool", 45);
          showAlert("ANOMALY: High usage volume detected!", "warn");
          timerEl.innerText = "00:15"; // 倒计时缩短
        })
        .to(activeBin, { backgroundColor: "#e0e7ff", duration: 0.3, delay: 0.4 })

      // 阶段 3: Emp 3 取件，库存见底触发补货
      tl.to("#queue-area", { x: -240, duration: 1.5, delay: 1 })
        .call(() => {
          activeBin.style.backgroundColor = "#86efac";
          logActivity("Emp 3", "SKU-3", "Precision Tool", 30);
          showAlert("CRITICAL: Low stock! Triggering order", "danger");
          timerEl.innerText = "00:03";
        })
        .to(activeBin, { backgroundColor: "#e0e7ff", duration: 0.3, delay: 0.4 })

      // 阶段 4: 员工清场，补货员推车进场
      tl.to("#queue-area", { opacity: 0, duration: 0.5, delay: 0.5 })
        .call(() => {
          showAlert("Auto-restock agent dispatched", "info");
        })
        .to("#restocker-group", { x: 300, duration: 2 })
        .call(() => {
          activeBin.style.backgroundColor = "#fde047"; // 补货黄光
        })
        .to({}, { duration: 1 }) // 补货耗时停顿
        
      // 阶段 5: 补货完成，数据重置
      tl.call(() => {
        currentStock = INITIAL_STOCK;
        forecastDemand = 1200;
        stockEl.innerText = currentStock;
        forecastEl.innerText = forecastDemand.toLocaleString();
        timerEl.innerText = "00:45";
        activeBin.style.backgroundColor = "#e0e7ff";

        const restockLog = document.createElement('div');
        restockLog.className = "p-1.5 bg-emerald-50 rounded border-l-2 border-emerald-500 border border-emerald-200 flex justify-between items-center text-emerald-800 shadow-sm";
        restockLog.innerHTML = `
          <div>
            <span class="font-bold">[RESTOCK]</span> 
            <span class="text-slate-400">${getTimestamp()}</span>
            <div class="text-[9px] text-emerald-600">Inventory replenished</div>
          </div>
          <span class="text-emerald-600 font-bold">+80</span>
        `;
        logList.prepend(restockLog);
      })
      .to("#restocker-group", { x: 650, opacity: 0, duration: 1.5, delay: 0.5 })
      .set("#queue-area", { x: 0, opacity: 1 })
      .set("#restocker-group", { x: 0, opacity: 1, delay: 1 });
    }

    window.onload = startPipeline;
  </script>
</body>
</html>
