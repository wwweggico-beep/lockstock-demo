<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOCKSTOCK - Smart Inventory System</title>
  <!-- 引入样式库 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入动画库 GSAP (稍后步骤会用到) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <style>
    /* 隐藏滚动条让手机UI更逼真 */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-900 text-white flex flex-col md:flex-row h-screen w-screen overflow-hidden font-sans">

  <!-- ================= LEFT: Physical Onsite Area ================= -->
  <div class="w-full md:w-1/2 h-1/2 md:h-full border-b md:border-b-0 md:border-r border-slate-800 relative flex flex-col items-center justify-center p-6 bg-slate-950">
    <div class="absolute top-6 left-6 text-sm font-semibold tracking-wider text-slate-400 uppercase">
      Onsite Facility
    </div>

    <!-- Smart Locker (智能柜) -->
    <div id="smart-locker" class="w-44 h-72 bg-slate-900 border-2 border-indigo-500 rounded-lg flex flex-col justify-between p-3 shadow-2xl relative z-10">
      <div class="text-[10px] text-indigo-400 font-mono text-center tracking-widest border-b border-slate-800 pb-1">LOCKSTOCK HUB</div>
      <div class="h-10 bg-slate-800 rounded border border-slate-700 flex items-center justify-center text-xs text-slate-400 font-mono">BIN 01</div>
      <div class="h-10 bg-slate-800 rounded border border-slate-700 flex items-center justify-center text-xs text-slate-400 font-mono">BIN 02</div>
      <!-- 这是一个有物品的活动格口 -->
      <div id="active-bin" class="h-10 bg-indigo-600 rounded border border-indigo-400 flex items-center justify-center text-xs font-bold font-mono tracking-wider shadow">SKU-A89</div>
      <div class="h-10 bg-slate-800 rounded border border-slate-700 flex items-center justify-center text-xs text-slate-400 font-mono">BIN 04</div>
    </div>

    <!-- 员工排队区 (纯色块代替) -->
    <div id="queue-area" class="absolute bottom-16 right-8 flex space-x-6 items-end">
      <!-- 员工 3 (蓝色方块) -->
      <div class="flex flex-col items-center">
        <div class="text-[9px] text-slate-500 mb-1">Emp 3</div>
        <div class="w-10 h-20 bg-blue-600 rounded-t-md border-t-2 border-blue-400"></div>
      </div>
      <!-- 员工 2 (蓝色方块) -->
      <div class="flex flex-col items-center">
        <div class="text-[9px] text-slate-500 mb-1">Emp 2</div>
        <div class="w-10 h-20 bg-blue-600 rounded-t-md border-t-2 border-blue-400"></div>
      </div>
      <!-- 员工 1 (蓝色方块) -->
      <div class="flex flex-col items-center">
        <div class="text-[9px] text-slate-500 mb-1">Emp 1</div>
        <div class="w-10 h-20 bg-blue-600 rounded-t-md border-t-2 border-blue-400"></div>
      </div>
    </div>

    <!-- 补货员 + 推车 (橙色代表补货员，黄色小方块代表推车，目前在画面最左侧外) -->
    <div id="restocker-group" class="absolute bottom-16 -left-48 flex items-end">
      <div class="flex flex-col items-center">
        <div class="text-[9px] text-amber-400 mb-1">Restocker</div>
        <div class="w-10 h-20 bg-amber-500 rounded-t-md border-t-2 border-amber-300"></div>
      </div>
      <!-- 推车小方块 -->
      <div class="w-14 h-10 bg-amber-700 border border-amber-500 ml-1 rounded-sm flex items-center justify-center text-[10px] text-amber-200 font-mono">
        CART
      </div>
    </div>
  </div>

  <!-- ================= RIGHT: Mobile App Interface ================= -->
  <div class="w-full md:w-1/2 h-1/2 md:h-full flex flex-col items-center justify-center p-4 bg-slate-900">
    
    <!-- 模拟手机外壳 -->
    <div class="w-[320px] h-[580px] bg-black border-4 border-slate-800 rounded-[36px] p-4 flex flex-col relative shadow-2xl overflow-hidden">
      
      <!-- 顶部灵动岛样式 -->
      <div class="w-24 h-4 bg-slate-900 rounded-full mx-auto mb-3"></div>

      <!-- 监控面板 -->
      <div class="bg-slate-900/90 p-3 rounded-xl border border-slate-800 mb-2">
        <div class="text-[10px] uppercase font-mono tracking-wider text-slate-400 mb-2">Inventory Dashboard</div>
        
        <div class="grid grid-cols-2 gap-2 text-center">
          <div class="bg-slate-950 p-2 rounded border border-slate-800">
            <span class="text-[10px] text-slate-500 uppercase block">In Stock</span>
            <span id="stock-val" class="text-lg font-mono font-bold text-emerald-400">100</span>
          </div>
          <div class="bg-slate-950 p-2 rounded border border-slate-800">
            <span class="text-[10px] text-slate-500 uppercase block">Forecast / Mo</span>
            <span id="forecast-val" class="text-lg font-mono font-bold text-indigo-400">1,200</span>
          </div>
        </div>

        <div class="mt-2 text-[10px] flex justify-between items-center text-slate-400 px-1 font-mono">
          <span>Auto-Restock ETA:</span>
          <span id="countdown" class="text-amber-400 font-bold">00:45</span>
        </div>
      </div>

      <!-- 动态警告展示区 (预留位置) -->
      <div id="alert-container" class="h-8 mb-2 flex items-center">
        <!-- 弹窗稍后用JS填入 -->
      </div>

      <!-- 实时存取记录 -->
      <div class="flex-1 flex flex-col overflow-hidden">
        <span class="text-[10px] uppercase tracking-wider font-mono text-slate-500 mb-1">Live Activity Log</span>
        <div id="log-container" class="flex-1 bg-slate-950 rounded-lg p-2 overflow-y-auto no-scrollbar space-y-1.5 border border-slate-900 text-[11px] font-mono">
          <!-- 静态占位展示，后续会动态追加 -->
          <div class="p-1.5 bg-slate-900/50 rounded border-l-2 border-slate-600 flex justify-between text-slate-400">
            <div>
              <span class="text-slate-500">SYSTEM</span>
              <span class="ml-1 text-slate-300">Ready</span>
            </div>
            <span class="text-slate-500">STANDBY</span>
          </div>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
