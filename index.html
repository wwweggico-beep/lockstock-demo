<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOCKSTOCK - Smart Warehouse Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* 像素小人 */
    .pixel-man {
      width: 14px;
      height: 24px;
      position: absolute;
    }
    .pixel-head {
      width: 10px;
      height: 10px;
      margin: 0 auto;
      border-radius: 2px;
    }
    .pixel-body {
      width: 14px;
      height: 14px;
      border-radius: 2px 2px 0 0;
      position: relative;
    }

    /* 3D 柜门 */
    .perspective-box {
      perspective: 300px;
    }
    .locker-door {
      transform-origin: left center;
      transition: transform 0.4s ease, background-color 0.3s;
    }
    .door-open {
      transform: rotateY(-75deg);
      background-color: #34d399 !important;
    }

    /* 手机呼吸灯 */
    @keyframes orangeGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(245, 158, 11, 0.2); }
      50% { box-shadow: 0 0 35px rgba(245, 158, 11, 0.8); }
    }
    .alert-glow-orange {
      animation: orangeGlow 1.2s infinite ease-in-out;
      border-color: #f59e0b !important;
    }

    @keyframes redGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(239, 68, 68, 0.3); }
      50% { box-shadow: 0 0 40px rgba(239, 68, 68, 0.9); }
    }
    .alert-glow-red {
      animation: redGlow 1.2s infinite ease-in-out;
      border-color: #ef4444 !important;
    }

    /* 日志平滑进入 */
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .log-enter {
      animation: slideIn 0.35s ease-out forwards;
    }
  </style>
</head>
